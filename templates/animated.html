<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公司宣传 PPT 动画演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0E27;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .slide {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: #0A0E27;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.6s ease-in-out;
  }
  .slide.active {
    display: flex;
    opacity: 1;
  }
  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .nav {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 10px;
  }
  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: all 0.3s;
  }
  .dot.active {
    background: #00D4FF;
    box-shadow: 0 0 10px #00D4FF;
  }
  .info {
    position: fixed;
    top: 20px; left: 20px;
    color: #00D4FF;
    font-size: 14px;
    z-index: 100;
  }
  .controls {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
    display: flex;
    gap: 8px;
  }
  .btn {
    background: rgba(0, 212, 255, 0.2);
    color: #00D4FF;
    border: 1px solid #00D4FF;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .btn:hover { background: rgba(0, 212, 255, 0.4); }
</style>
</head>
<body>

<div class="info" id="info">01 / 15</div>
<div class="controls">
  <button class="btn" onclick="prev()">← 上一页</button>
  <button class="btn" onclick="next()">下一页 →</button>
  <button class="btn" onclick="toggleAuto()">自动播放</button>
</div>

<div class="slide active" data-idx="1"><img src="p1.png" alt="P1"></div>
<div class="slide" data-idx="2"><img src="p2.png" alt="P2"></div>
<div class="slide" data-idx="3"><img src="p3.png" alt="P3"></div>
<div class="slide" data-idx="4"><img src="p4.png" alt="P4"></div>
<div class="slide" data-idx="5"><img src="p5.png" alt="P5"></div>
<div class="slide" data-idx="6"><img src="p6.png" alt="P6"></div>
<div class="slide" data-idx="7"><img src="p7.png" alt="P7"></div>
<div class="slide" data-idx="8"><img src="p8.png" alt="P8"></div>
<div class="slide" data-idx="9"><img src="p9.png" alt="P9"></div>
<div class="slide" data-idx="10"><img src="p10.png" alt="P10"></div>
<div class="slide" data-idx="11"><img src="p11.png" alt="P11"></div>
<div class="slide" data-idx="12"><img src="p12.png" alt="P12"></div>
<div class="slide" data-idx="13"><img src="p13.png" alt="P13"></div>
<div class="slide" data-idx="14"><img src="p14.png" alt="P14"></div>
<div class="slide" data-idx="15"><img src="p15.png" alt="P15"></div>

<div class="nav" id="nav"></div>

<script>
  let current = 1;
  const total = 15;
  let autoTimer = null;

  function show(idx) {
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    const target = document.querySelector(`.slide[data-idx="${idx}"]`);
    if (target) target.classList.add('active');
    document.getElementById('info').textContent = `${String(idx).padStart(2,'0')} / ${total}`;
    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i + 1 === idx);
    });
    current = idx;
  }

  function next() { show(current < total ? current + 1 : 1); }
  function prev() { show(current > 1 ? current - 1 : total); }

  function toggleAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
    autoTimer = setInterval(next, 4000);
  }

  // Build nav dots
  const nav = document.getElementById('nav');
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 1 ? ' active' : '');
    d.onclick = () => show(i);
    nav.appendChild(d);
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  });
</script>

</body>
</html>
